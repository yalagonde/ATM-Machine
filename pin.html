```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATM - Enter PIN</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #312e81
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ATM Box */

        .atm-box {
            width: 430px;
            padding: 40px 35px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5);

            backdrop-filter: blur(12px);
        }

        /* ATM Icon */

        .atm-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        /* Heading */

        h1 {
            color: #38bdf8;
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h2 {
            color: white;
            font-size: 22px;
            margin-bottom: 25px;
        }

        /* Card Slot */

        .card-slot {
            width: 230px;
            height: 12px;

            background: #020617;

            margin: 0 auto 25px auto;

            border-radius: 10px;

            box-shadow:
                0 0 10px #38bdf8;
        }

        .card-text {
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 15px;
        }

        /* Error */

        .error {
            background: rgba(239, 68, 68, 0.15);

            border: 1px solid #ef4444;

            color: #f87171;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 15px;
        }

        /* PIN Input */

        .pin-input {
            width: 100%;

            padding: 16px;

            font-size: 24px;

            text-align: center;

            letter-spacing: 10px;

            color: #111827;

            background: white;

            border: none;

            border-radius: 12px;

            outline: none;

            margin-bottom: 20px;
        }

        .pin-input:focus {
            box-shadow: 0 0 15px #38bdf8;
        }

        /* Button */

        .verify-btn {
            width: 100%;

            padding: 15px;

            background: linear-gradient(
                135deg,
                #22c55e,
                #16a34a
            );

            color: white;

            border: none;

            border-radius: 12px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .verify-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(34, 197, 94, 0.4);
        }

        /* Footer */

        .footer {
            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;
        }

    </style>

</head>


<body>

    <div class="atm-box">

        <div class="atm-icon">
            🏧
        </div>

        <h1>ATM MACHINE</h1>

        <h2>🔐 Enter Your PIN</h2>

        <div class="card-slot"></div>

        <p class="card-text">
            Please enter your 4-digit ATM PIN
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form action="{{ url_for('verify_pin') }}" method="POST">

            <input
                type="password"
                name="pin"
                class="pin-input"
                maxlength="4"
                minlength="4"
                pattern="[0-9]{4}"
                placeholder="••••"
                required
                autocomplete="off"
            >

            <button
                type="submit"
                class="verify-btn"
            >
                🔓 VERIFY PIN
            </button>

        </form>


        <div class="footer">
            🔒 Your PIN is secure
        </div>

    </div>

</body>

</html>
```
